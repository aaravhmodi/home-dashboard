---
# The app tiles. https://gethomepage.dev/configs/services/
#   href         what opens when you click the tile
#   siteMonitor  checked every few seconds for the status dot and response time
#   container    shows that container's state, CPU and memory under the tile

- Apps:
    - Internship Tracker:
        href: http://100.76.57.23:8765
        description: Postings, founders, drafts and application answers
        icon: mdi-briefcase-search
        siteMonitor: http://100.76.57.23:8765
        server: local
        container: intern-agent-dashboard-1

    - Study Agent:
        href: http://100.76.57.23:8000
        description: Course questions, notes and assessments
        icon: mdi-school
        siteMonitor: http://100.76.57.23:8000/health
        server: local
        container: study-agent-dashboard-1

    - Study Agent browser:
        href: http://100.76.57.23:6080
        description: The browser Study Agent uses to read LEARN
        icon: mdi-monitor-eye
        server: local
        container: study-agent-browser-1

    - Enerzen:
        href: http://100.76.57.23:3000
        description: Enerzen web app
        icon: mdi-lightning-bolt
        siteMonitor: http://100.76.57.23:3000
        server: local
        container: enerzen-web-1

    - Enerzen API:
        href: http://100.76.57.23:8001/docs
        description: Enerzen backend and API docs
        icon: mdi-api
        siteMonitor: http://100.76.57.23:8001/health
        server: local
        container: enerzen-api-1

- Monitoring:
    - Uptime Kuma:
        href: http://100.76.57.23:3001
        description: Up/down history for every app; sends the phone alerts
        icon: uptime-kuma.png
        siteMonitor: http://100.76.57.23:3001
        server: local
        container: homelab-uptime-kuma-1

    - Grafana:
        href: http://100.76.57.23:3002
        description: Server graphs over time (CPU, memory, disk, apps)
        icon: grafana.png
        siteMonitor: http://100.76.57.23:3002/api/health
        server: local
        container: monitoring-grafana-1

# Services the apps rely on. No page to open; the tile shows whether the container is
# running and what it's using.
- Behind the scenes:
    - PostgreSQL:
        description: Database
        icon: postgres.png
        server: local
        container: homelab-postgres-1

    - Redis:
        description: Cache and queues
        icon: redis.png
        server: local
        container: homelab-redis-1

    - Cloudflare tunnel:
        description: Makes public sites reachable from the internet
        icon: cloudflare.png
        server: local
        container: cloudflared

    - Prometheus:
        description: Collects the numbers behind Grafana
        icon: prometheus.png
        server: local
        container: monitoring-prometheus-1
